<!DOCTYPE html>
<html lang="en">
<head>
    <title>Mark Attendance</title>
</head>
<body>
    <h1>MARK ATTENDANCE</h1>
    {% if message %}
        <p>{{ message }}</p>
    {% endif %}
    {% if error %}
        <p>{{ error }}</p>
    {% endif %}
    <form method="POST">
        {% csrf_token %}
        <label>Registration Number:</label>
        <input type="text" name="registration_number" required>
        <br><br>
        <button type="submit">Mark Present</button>
    </form>
    <br>
    <a href="/attendance/">
        <button>Back to Attendance</button>
    </a>
</body>
</html>
