<!DOCTYPE html>
<html lang="en">
<head>
    <title>Employee Login</title>
</head>
<body>
    <h1>TEACHER'S LOGIN</h1>
    <form method="POST">
        {% csrf_token %}
        <label for="username_id">Username:</label>
        <input type="text" id="username_id" name="username" autocomplete="off" required>
        <br><br>
        <label for="password_id">Password:</label>
        <input type="password" id="password_id" name="password" autocomplete="new-password" required>
        <br><br>
        <button type="submit">LOGIN</button>
    </form>
    <br>
    <a href="/login/">Back to Login Page</a>
</body>
</html>
